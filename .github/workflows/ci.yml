name: Fork baseline CI

on:
  push:
    branches:
      - main
      - develop
      - 'bas-**'
      - 'feature/**'
      - 'feature_*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.14', '3.12.14']
    env:
      DISABLE_TELEMETRY: 'true'
      BLENDER_MCP_SAFE_MODE: '1'
    steps:
      - name: Check out fork source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync the committed lockfile
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Compile Python sources (including the bpy-dependent addon)
        run: uv run --frozen --python ${{ matrix.python-version }} python -m compileall -q src tests scripts addon.py main.py
      - name: Lint new baseline scripts
        run: uv run --frozen --python ${{ matrix.python-version }} --with ruff==0.14.0 ruff check --select E4,E7,E9,F63,F7,F82 tests/test_fork_baseline.py tests/test_golden_runtime.py tests/test_studio_contracts.py src/blender_mcp/studio scripts
      - name: Run upstream and fork unit tests
        run: uv run --frozen --python ${{ matrix.python-version }} --with pytest==8.4.2 pytest -q
      - name: Check fork CLI entrypoint
        run: uv run --frozen --python ${{ matrix.python-version }} mcp-for-blender --help
      - name: Build source and wheel distributions
        run: uv build

  blender-headless-smoke:
    name: Blender 4.5.15 golden CPU (PR/manual)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12.14'
      - name: Install shared libraries (Blender itself is checksum-pinned)
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
      - name: Render and reopen golden scene with the pinned runtime
        run: uv run --frozen python scripts/run_golden.py --output-dir "${{ runner.temp }}/blender-golden"
      - name: Verify evidence bundle
        run: uv run --frozen python scripts/run_golden.py --output-dir "${{ runner.temp }}/blender-golden" --verify-only
      - name: Upload BLEND, PNG, environment, checksums and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas02-blender-golden-artifacts
          path: ${{ runner.temp }}/blender-golden
          retention-days: 30
          if-no-files-found: warn
