name: Fork baseline CI

on:
  push:
    branches:
      - main
      - develop
      - 'bas-**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      DISABLE_TELEMETRY: 'true'
      BLENDER_MCP_SAFE_MODE: '1'
    steps:
      - name: Check out fork source
        uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync the committed lockfile
        run: uv sync --frozen
      - name: Compile Python sources (including the bpy-dependent addon)
        run: uv run --frozen python -m compileall -q src tests scripts addon.py main.py
      - name: Lint new baseline scripts
        run: uv run --frozen --with ruff==0.14.0 ruff check --select E4,E7,E9,F63,F7,F82 tests/test_fork_baseline.py scripts/blender_headless_smoke.py
      - name: Run upstream and fork unit tests
        run: uv run --frozen --with pytest==8.4.2 pytest -q
      - name: Check fork CLI entrypoint
        run: uv run --frozen mcp-for-blender --help
      - name: Build source and wheel distributions
        run: uv build

  blender-headless-smoke:
    name: Blender CPU smoke (PR/manual)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender from Ubuntu
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Run Blender without a GPU or GUI
        run: blender --background --factory-startup --python scripts/blender_headless_smoke.py -- --output-dir "${{ runner.temp }}/blender-baseline"
      - name: Validate Blender outputs
        env:
          BAS01_OUT: ${{ runner.temp }}/blender-baseline
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import struct

          out = Path(os.environ["BAS01_OUT"])
          blend = out / "baseline.blend"
          png = out / "preview.png"
          assert blend.is_file() and blend.stat().st_size > 1024, "Missing/empty .blend"
          assert png.is_file() and png.stat().st_size > 64, "Missing/empty .png"
          assert blend.read_bytes()[:7] == b"BLENDER", "Invalid .blend header"
          with png.open("rb") as f:
              header = f.read(24)
          assert header[:8] == b"\x89PNG\r\n\x1a\n", "Invalid PNG signature"
          width, height = struct.unpack(">II", header[16:24])
          assert (width, height) == (320, 180), f"Bad render size: {width}x{height}"
          print(f"BAS01_ARTIFACTS_OK .blend={blend.stat().st_size}B png={png.stat().st_size}B {width}x{height}")
          PY
      - name: Upload .blend and preview image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas01-blender-headless-artifacts
          path: ${{ runner.temp }}/blender-baseline
          if-no-files-found: warn
