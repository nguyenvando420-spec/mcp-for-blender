name: Fork baseline CI

on:
  push:
    branches:
      - main
      - develop
      - 'bas-**'
      - 'feature/**'
      - 'feature_*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.14', '3.12.14']
    env:
      DISABLE_TELEMETRY: 'true'
      BLENDER_MCP_SAFE_MODE: '1'
    steps:
      - name: Check out fork source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # compatibility matrix uses historical git show <ref>:addon.py
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync the committed lockfile
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Compile Python sources (including the bpy-dependent addon)
        run: uv run --frozen --python ${{ matrix.python-version }} python -m compileall -q src tests scripts addon.py main.py
      - name: Lint new baseline scripts
        run: uv run --frozen --python ${{ matrix.python-version }} --with ruff==0.14.0 ruff check --select E4,E7,E9,F63,F7,F82 tests/test_fork_baseline.py tests/test_golden_runtime.py tests/test_studio_contracts.py src/blender_mcp/studio scripts
      - name: Diagnose Studio schema drift
        run: uv run --frozen --python ${{ matrix.python-version }} python scripts/bas11_schema_diff.py
      - name: BAS-14 validate frozen 20-prompt rubric and print corpus digest
        run: uv run --frozen --python ${{ matrix.python-version }} python scripts/bas14_benchmark.py validate --suite benchmarks/bas14_suite.json
      - name: Run upstream and fork unit tests
        run: uv run --frozen --python ${{ matrix.python-version }} --with pytest==8.4.2 --with zstandard==0.25.0 pytest -q -rs --junitxml="${{ runner.temp }}/bas09-pytest.xml"
      - name: Inventory skipped tests
        run: uv run --frozen --python ${{ matrix.python-version }} python scripts/bas09_ci_report.py pytest --input "${{ runner.temp }}/bas09-pytest.xml" --output "${{ runner.temp }}/bas09-pytest-skips.json"
      - name: Show skip coverage and categorize any remaining omissions
        run: cat "${{ runner.temp }}/bas09-pytest-skips.json"
      - name: BAS-06 ten restart/rebind cycles with diagnostic log
        run: uv run --frozen --python ${{ matrix.python-version }} --with pytest==8.4.2 pytest -s -q tests/test_bas06_socket_security.py::test_ten_successive_restart_rebind_cycles
      - name: Upload BAS09 skipped test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas09-python-${{ matrix.python-version }}-skips
          path: |
            ${{ runner.temp }}/bas09-pytest.xml
            ${{ runner.temp }}/bas09-pytest-skips.json
          if-no-files-found: warn
      - name: Check fork CLI entrypoint
        run: uv run --frozen --python ${{ matrix.python-version }} mcp-for-blender --help
      - name: Build source and wheel distributions
        run: uv build

  blender-headless-smoke:
    name: Blender 4.5.15 MCP GUI / pinned Python 3.12.14
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
      - name: Install shared libraries (Blender itself is checksum-pinned)
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1 xvfb xauth
      - name: Render and reopen golden scene with the pinned runtime
        run: uv run --frozen --python 3.12.14 python scripts/run_golden.py --output-dir "${{ runner.temp }}/blender-golden"
      - name: Verify evidence bundle
        run: uv run --frozen --python 3.12.14 python scripts/run_golden.py --output-dir "${{ runner.temp }}/blender-golden" --verify-only
      - name: BAS-10 pinned Blender PBR/Geometry Nodes golden and independent reopen
        run: |
          .blender-runtime/runtime/blender-4.5.15-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/bas10_blender_golden.py -- --output-dir "${{ runner.temp }}/bas10-golden"
      - name: BAS-10 independently validate BLEND/PNG evidence and checksums
        run: uv run --frozen --python 3.12.14 python scripts/bas10_verify_evidence.py --output-dir "${{ runner.temp }}/bas10-golden"
      - name: BAS-14 curved normals and extruded PBR text regression
        run: .blender-runtime/runtime/blender-4.5.15-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/bas14_quality_golden.py -- "${{ runner.temp }}/bas14-quality"
      - name: BAS-11 pinned camera/light/world golden and independent reopen
        run: |
          .blender-runtime/runtime/blender-4.5.15-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/bas11_blender_golden.py -- --output-dir "${{ runner.temp }}/bas11-golden"
          .blender-runtime/runtime/blender-4.5.15-linux-x64/blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/bas11_blender_golden.py -- --output-dir "${{ runner.temp }}/bas11-golden" --reopen
          test -s "${{ runner.temp }}/bas11-golden/bas11-reopen.json"
      - name: BAS-13 isolated render/export jobs with manifests and GLB independent reimport
        run: |
          uv run --frozen --python 3.12.14 python scripts/bas13_artifact_e2e.py --golden "${{ runner.temp }}/bas11-golden" --output-dir "${{ runner.temp }}/bas13-evidence"
      - name: BAS-05/BAS-06 MCP GUI E2E + 100-command stress (Xvfb)
        run: uv run --frozen --python 3.12.14 python scripts/bas05_mcp_e2e.py --output-dir "${{ runner.temp }}/bas05-mcp-gui"
      - name: BAS-06 real independent Blender render worker + durable SQLite recovery
        run: uv run --frozen --python 3.12.14 python scripts/bas06_worker_e2e.py --scene "${{ runner.temp }}/bas05-mcp-gui/bas05-scene.blend" --output-dir "${{ runner.temp }}/bas06-worker"
      - name: Validate BAS09 thirteen integration cases
        run: uv run --frozen --python 3.12.14 python scripts/bas09_ci_report.py gui --input "${{ runner.temp }}/bas05-mcp-gui/bas05-e2e.json" --output "${{ runner.temp }}/bas05-mcp-gui/bas09-evidence.json" --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Display GUI acceptance checks and artifact SHA256
        run: cat "${{ runner.temp }}/bas05-mcp-gui/bas09-evidence.json"
      - name: Upload BLEND, PNG, environment, checksums and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas09-gui-pinned-3.12.14-evidence
          path: |
            ${{ runner.temp }}/blender-golden
            ${{ runner.temp }}/bas05-mcp-gui
            ${{ runner.temp }}/bas06-worker
            ${{ runner.temp }}/bas10-golden
            ${{ runner.temp }}/bas11-golden
            ${{ runner.temp }}/bas13-evidence
            ${{ runner.temp }}/bas14-quality
          retention-days: 30
          if-no-files-found: warn
